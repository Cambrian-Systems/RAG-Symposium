# Project identity and runtime requirements. uv reads this file during setup.
[project]
name = "rag-symposium"
version = "0.1.0"
description = "A small local MCP server for ingested data"
requires-python = ">=3.11,<3.14"
# Keep the tested v1 SDK API. uv.lock pins its exact resolved dependencies.
# model2vec runs the small static embedding model for hybrid search (CPU only).
dependencies = ["mcp>=1.30,<2", "model2vec>=0.10,<0.11"]

[project.scripts]
# Makes `uv run rag-symposium` call main() in src/rag_symposium/server.py.
rag-symposium = "rag_symposium.server:main"
# Makes `uv run rag-ingest` chunk corpus/docs into the export the server reads.
rag-ingest = "rag_symposium.ingest:main"
# Makes `uv run rag-eval` score search modes against evals/starter.jsonl.
rag-eval = "rag_symposium.evaluate:main"
# Makes `uv run rag-search "question"` print one query's results in each mode.
rag-search = "rag_symposium.search:main"
# Makes `uv run rag-check` print PASS/FAIL for the export, model and searches.
rag-check = "rag_symposium.check:main"
# Makes `uv run rag-sessions` turn local AI-agent sessions into searchable documents.
rag-sessions = "rag_symposium.sessions:main"

[build-system]
# Hatchling packages the source so command-line entry points/imports work.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only ship the Python package, not local data, tests, or the virtual environment.
packages = ["src/rag_symposium"]
