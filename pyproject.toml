# Project identity and runtime requirements. uv reads this file during setup.
[project]
name = "rag-symposium"
version = "0.1.0"
description = "A small local MCP server for ingested data"
requires-python = ">=3.11,<3.14"
# Keep the tested v1 SDK API. uv.lock pins its exact resolved dependencies.
# The SDK also supplies the HTTP server/client libraries used by this project.
dependencies = ["mcp>=1.30,<2"]

[project.scripts]
# Makes `uv run rag-symposium` call main() in src/rag_symposium/server.py.
rag-symposium = "rag_symposium.server:main"

[build-system]
# Hatchling packages the source so command-line entry points/imports work.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only ship the Python package, not local data, tests, or the virtual environment.
packages = ["src/rag_symposium"]
